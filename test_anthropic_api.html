<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anthropic API テスト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 24px;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 20px; color: #1a1a1a; }
    label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 6px; }
    input[type="password"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="password"]:focus, select:focus { border-color: #6c47ff; }
    button {
      width: 100%;
      padding: 12px;
      background: #6c47ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #5538d4; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.6;
      display: none;
    }
    .result.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .result.error   { background: #fdecea; color: #b71c1c; border: 1px solid #ef9a9a; }
    .note { font-size: 0.75rem; color: #888; margin-top: 8px; }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔑 Anthropic API 動作確認</h1>

    <label for="apiKey">APIキー</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">

    <label for="model">モデル</label>
    <select id="model">
      <option value="claude-haiku-4-5">claude-haiku-4-5（最速・格安）</option>
      <option value="claude-sonnet-4-6">claude-sonnet-4-6（バランス型）</option>
      <option value="claude-opus-4-7">claude-opus-4-7（最高性能）</option>
    </select>

    <button id="testBtn" onclick="testAPI()">テスト実行</button>
    <p class="note">※ APIキーはこのページ外に送信されません（直接Anthropicへ通信）</p>

    <div id="result" class="result"></div>
  </div>

  <script>
    async function testAPI() {
      const key = document.getElementById("apiKey").value.trim();
      const model = document.getElementById("model").value;
      const btn = document.getElementById("testBtn");
      const result = document.getElementById("result");

      if (!key) {
        showResult("error", "❌ APIキーを入力してください");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>接続中...';
      result.style.display = "none";

      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "x-api-key": key,
            "anthropic-version": "2023-06-01",
            "content-type": "application/json",
          },
          body: JSON.stringify({
            model: model,
            max_tokens: 64,
            messages: [{ role: "user", content: "「APIは正常に動作しています」と日本語で答えてください。" }],
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          const msg = data?.error?.message || `HTTP ${res.status}`;
          if (res.status === 401) showResult("error", `❌ 認証エラー: APIキーが無効です\n${msg}`);
          else if (res.status === 403) showResult("error", `❌ 権限エラー: このAPIキーは使用できません\n${msg}`);
          else if (res.status === 429) showResult("error", `❌ レート制限: しばらく待ってから再試行してください\n${msg}`);
          else showResult("error", `❌ エラー (${res.status}): ${msg}`);
          return;
        }

        const text = data.content?.find(b => b.type === "text")?.text ?? "(応答なし)";
        showResult("success",
          `✅ 成功！\n\n📝 応答: ${text}\n\n📊 使用トークン: 入力 ${data.usage.input_tokens} / 出力 ${data.usage.output_tokens}\n🤖 モデル: ${data.model}`
        );

      } catch (e) {
        if (e.name === "TypeError") {
          showResult("error", "❌ 接続エラー: ネットワークを確認してください\n\nCORSエラーの場合はブラウザの制限により直接テストできません。curl または Python スクリプトをお使いください。");
        } else {
          showResult("error", `❌ エラー: ${e.message}`);
        }
      } finally {
        btn.disabled = false;
        btn.textContent = "テスト実行";
      }
    }

    function showResult(type, msg) {
      const el = document.getElementById("result");
      el.className = `result ${type}`;
      el.style.display = "block";
      el.style.whiteSpace = "pre-wrap";
      el.textContent = msg;
    }

    document.getElementById("apiKey").addEventListener("keydown", e => {
      if (e.key === "Enter") testAPI();
    });
  </script>
</body>
</html>
